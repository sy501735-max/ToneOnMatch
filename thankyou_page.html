<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToneOnMatch | 신청 완료</title>
  <!-- OG / SNS 공유 메타태그 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ToneOnMatch | 무료 가이드 받으셨어요">
  <meta property="og:description" content="내 분위기 유형 무료 진단이 준비됐어요. 셀카를 업로드하고 AI 분석을 시작해보세요.">
  <meta property="og:url" content="https://toneonmatch.com/thankyou_page.html">
  <meta property="og:image" content="https://toneonmatch.com/og_image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="ToneOnMatch">
  <!-- 트위터 카드 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ToneOnMatch | 무료 가이드 받으셨어요">
  <meta name="twitter:description" content="내 분위기 유형 무료 진단이 준비됐어요. 셀카를 업로드하고 AI 분석을 시작해보세요.">
  <meta name="twitter:image" content="https://toneonmatch.com/og_image.jpg">
  <!-- 검색엔진 -->
  <meta name="description" content="내 분위기 유형 무료 진단이 준비됐어요. 셀카를 업로드하고 AI 분석을 시작해보세요.">
  <link rel="canonical" href="https://toneonmatch.com/thankyou_page.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #03040a;
      --surface: rgba(10,12,22,0.95);
      --surface2: rgba(20,24,40,0.6);
      --border: rgba(255,255,255,0.06);
      --border-hi: rgba(129,140,248,0.3);
      --text: #f0f2ff;
      --muted: #8892b0;
      --dim: #4a5568;
      --primary: #818cf8;
      --primary2: #6366f1;
      --primary-glow: rgba(99,102,241,0.4);
      --rose: #e8a598;
      --gold: #c9a96e;
      --r: 16px;
      --r2: 28px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--bg); scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 80% 50% at 5% -10%, rgba(99,102,241,0.18), transparent),
        radial-gradient(ellipse 60% 40% at 95% 10%, rgba(232,165,152,0.10), transparent),
        radial-gradient(ellipse 50% 60% at 50% 100%, rgba(99,102,241,0.07), transparent),
        #03040a;
    }

    a { color: inherit; text-decoration: none; }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ── WRAP ── */
    .page {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0 80px;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 60px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo-name {
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .logo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 12px rgba(129,140,248,0.8);
      animation: pulse 2.4s ease infinite;
    }
    @keyframes pulse {
      0%,100%{ box-shadow: 0 0 12px rgba(129,140,248,0.8); }
      50%{ box-shadow: 0 0 24px rgba(129,140,248,0.4); }
    }
    .logo-tone { color: var(--text); }
    .logo-match { color: var(--primary); }
    .logo-tagline {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.3px;
      margin-top: 3px;
      padding-left: 15px;
    }

    /* ── HERO SECTION ── */
    .hero {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 64px;
      align-items: center;
      margin-bottom: 80px;
    }

    .hero-left { }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(129,140,248,0.2);
      border-radius: 100px;
      padding: 6px 14px 6px 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 24px;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--primary);
      animation: breathe 2s ease infinite;
    }
    @keyframes breathe {
      0%,100%{ opacity:1; transform:scale(1); }
      50%{ opacity:0.3; transform:scale(0.6); }
    }

    h1 {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: clamp(28px, 3.6vw, 46px);
      font-weight: 600;
      line-height: 1.18;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
    }
    h1 em { color: var(--primary);  }
    h1 strong { color: var(--rose); font-style: normal; }

    .hero-copy {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.9;
      max-width: 480px;
      margin-bottom: 32px;
    }

    /* ── SNS 바이럴 훅 카드 ── */
    .hook-card {
      background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(232,165,152,0.06));
      border: 1px solid rgba(129,140,248,0.2);
      border-radius: var(--r2);
      padding: 20px 24px;
      max-width: 480px;
      position: relative;
      overflow: hidden;
    }
    .hook-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--rose), transparent);
    }
    .hook-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .hook-text {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 22px;
      font-weight: 400;
      
      color: var(--text);
      line-height: 1.5;
    }
    .hook-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ── RIGHT: PHONE FRAME ── */
    .phone-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .phone-shell {
      width: 360px;
      background: #07091a;
      border-radius: 48px;
      border: 1px solid rgba(129,140,248,0.15);
      box-shadow:
        0 0 0 6px rgba(10,12,22,0.9),
        0 0 0 7px rgba(129,140,248,0.08),
        0 60px 120px rgba(0,0,0,0.7),
        0 0 80px rgba(99,102,241,0.1);
      overflow: hidden;
      position: relative;
    }
    .phone-notch {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 110px; height: 28px;
      background: #07091a;
      border-radius: 0 0 16px 16px;
      z-index: 10;
    }
    .phone-shell iframe {
      width: 100%;
      height: 700px;
      border: none;
      display: block;
      border-radius: 48px;
    }
    .phone-btn-r { position:absolute;right:-7px;top:130px;width:4px;height:60px;background:rgba(129,140,248,0.12);border-radius:2px; }
    .phone-btn-l1 { position:absolute;left:-7px;top:110px;width:4px;height:32px;background:rgba(129,140,248,0.1);border-radius:2px; }
    .phone-btn-l2 { position:absolute;left:-7px;top:158px;width:4px;height:60px;background:rgba(129,140,248,0.1);border-radius:2px; }
    .phone-glow {
      position: absolute;
      bottom: -50px; left: 50%; transform: translateX(-50%);
      width: 280px; height: 100px;
      background: radial-gradient(ellipse, rgba(99,102,241,0.2), transparent 70%);
      pointer-events: none;
    }

    /* ── FOOTER ── */
    footer {
      padding-top: 40px;
      border-top: 1px solid var(--border);
      color: var(--dim);
      font-size: 12px;
      text-align: center;
    }

    /* ════════════════════════════════════
       진입 애니메이션
    ════════════════════════════════════ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero-left > * { animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both; }
    .hero-left > *:nth-child(1) { animation-delay: 0.05s; }
    .hero-left > *:nth-child(2) { animation-delay: 0.15s; }
    .hero-left > *:nth-child(3) { animation-delay: 0.25s; }
    .hero-left > *:nth-child(4) { animation-delay: 0.35s; }
    .phone-wrap { animation: fadeUp 0.8s 0.2s cubic-bezier(0.16,1,0.3,1) both; }

    /* ── MOBILE ── */
    @media (max-width: 960px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 40px;
      }
      .phone-wrap { max-width: 360px; margin: 0 auto; }
    }
    @media (max-width: 640px) {
      .page { width: calc(100% - 32px); padding-top: 22px; }
      nav { margin-bottom: 32px; }
      .phone-shell { border-radius: 36px; }
      .phone-shell iframe { border-radius: 36px; height: 640px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- ── NAV ── -->
    <nav>
      <a class="logo" href="landing page.html" aria-label="ToneOnMatch 홈">
        <div>
          <div class="logo-name">
            <span class="logo-dot"></span>
            <span class="logo-tone">ToneOn</span><span class="logo-match">Match</span>
          </div>
          <div class="logo-tagline">내 얼굴에 톤을 켜다</div>
        </div>
      </a>
    </nav>

    <!-- ════════════════════════════════════
         HERO — 신청 완료 + 앱 프레임
    ════════════════════════════════════ -->
    <section class="hero">

      <div class="hero-left">
        <div class="badge">
          <span class="badge-dot"></span>
          AI 첫인상 분석
        </div>

        <h1>
          사람들이 나를 처음 볼 때<br>
          <strong>어떤 인상</strong>을 받는지<br>
          <em>AI가 분석해드립니다</em>
        </h1>

        <p class="hero-copy">
          셀카 한 장이면 충분합니다.<br>
          AI가 <b>첫인상 수치</b>와 <b>닮은 연예인</b>,<br>
          그리고 사람들이 당신에 대해 <b>오해하는 점</b>까지<br>
          30초 안에 분석해드립니다.
        </p>

        <div class="hook-card">
          <div class="hook-label">✦ AI 첫인상 분석 결과</div>
          <div class="hook-text">"차가워 보임 <span style="color:#e8a598">88%</span>지만<br>신뢰감도 <span style="color:#c9a96e">92%</span>인 얼굴"</div>
          <div class="hook-sub">친구들이 나를 처음 보면 이런 인상을 받는다고 합니다 →</div>
        </div>
      </div>

      <!-- 앱 프레임 -->
      <aside class="phone-wrap">
        <div class="phone-shell">
          <div class="phone-notch"></div>
          <div class="phone-btn-r"></div>
          <div class="phone-btn-l1"></div>
          <div class="phone-btn-l2"></div>
          <iframe
            id="app-frame"
            src="index.html"
            title="ToneOnMatch AI 진단 앱"
            allow="camera"
            scrolling="yes">
          </iframe>
        </div>
        <div class="phone-glow"></div>
      </aside>

    </section>

    <!-- ── FOOTER ── -->
    <footer>
      <p>© 2026 ToneOnMatch. All rights reserved.</p>
    </footer>

  </div><!-- /page -->

  <script>
    // URL 파라미터에서 이름/이메일 주입 + sessionStorage 저장
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name') || '신청';
    const email = params.get('email') || '';

    // 이후 index.html → sales_page.html까지 이어지도록 저장
    if (name && name !== '신청') sessionStorage.setItem('tom_name', name);
    if (email) sessionStorage.setItem('tom_email', email);

    const nameEl = document.getElementById('name-head');
    if (nameEl) nameEl.textContent = name;

    // iframe 내부에서 sales_page로 이동 시 최상위 창 이동 처리
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'navigate') {
        window.location.href = e.data.url;
      }
    });

    // Scroll reveal
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.style.animation = 'fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both';
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
  </script>
</body>
</html>
